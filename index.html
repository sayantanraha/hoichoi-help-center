<script>
(function(w,d,s,a){
  w[a]=w[a]||{q:[],
    init:function(c){w[a].q.push({type:"init",config:c});if(w[a].loaded)w[a]._processQueue();},
    toggle:function(){w[a].q.push({type:"toggle"});if(w[a].loaded)w[a]._processQueue();},
    open:function(){w[a].q.push({type:"open"});if(w[a].loaded)w[a]._processQueue();},
    close:function(){w[a].q.push({type:"close"});if(w[a].loaded)w[a]._processQueue();},
    showWidget:function(){w[a].q.push({type:"showWidget"});if(w[a].loaded)w[a]._processQueue();},
    hideWidget:function(){w[a].q.push({type:"hideWidget"});if(w[a].loaded)w[a]._processQueue();},
    destroy:function(){w[a].q.push({type:"destroy"});if(w[a].loaded)w[a]._processQueue();},
    reloadIframe:function(){w[a].q.push({type:"reloadIframe"});if(w[a].loaded)w[a]._processQueue();},
    updateToken:function(t,c){w[a].q.push({type:"updateToken",callback:c});},
    _processQueue:function(){console.log("NuggetChat: real implementation not loaded yet");}
  };
  var n=d.createElement(s),c=d.getElementsByTagName(s)[0];
  n.async=1;
  n.src='https://hoichoi.nugget.com/user/chat-embed.js';
  n.onload=function(){w[a].loaded=true;w[a]._processQueue();};
  c.parentNode.insertBefore(n,c);
})(window,document,'script','NuggetChat');
</script>

<script>
async function fetchNuggetToken() {
  var uid = sessionStorage.getItem('hc_nugget_uid');
  if (!uid) {
    uid = Date.now().toString(36) + Math.random().toString(36).slice(2);
    sessionStorage.setItem('hc_nugget_uid', uid);
  }
  var cached = sessionStorage.getItem('hc_nugget_token');
  if (cached) return cached;
  var res = await fetch('/api/nugget-token?uid=' + encodeURIComponent(uid), { headers: { 'X-HC-Secret': window.__HC_SECRET__ || '' } });
  if (!res.ok && window._logApiError) window._logApiError('/api/nugget-token', res.status, 'Token fetch failed');
  var data = await res.json();
  if (data.accessToken) {
    sessionStorage.setItem('hc_nugget_token', data.accessToken);
    return data.accessToken;
  }
  throw new Error('Nugget token unavailable');
}

NuggetChat.init({
  accessTokenHandler: fetchNuggetToken,
  position: 'bottom-right',
  initiallyExpanded: false,
  viewType: 'issue',
  bubbleIcon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><defs><radialGradient id="hg" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#d20820"/><stop offset="100%" stop-color="#6d0550"/></radialGradient></defs><circle cx="28" cy="28" r="28" fill="url(#hg)"/><text x="28" y="40" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">h</text></svg>',
  bubbleStyles: { background: 'transparent', boxShadow: 'none', padding: 0, width: '56px', height: '56px' },
  bubbleIconStyles: { width: '56px', height: '56px' },
  chevronColor: '#000000',
});
NuggetChat.hideWidget();
</script>

<!-- ── Client-side Error Monitor ───────────────────────────────────────────────
  Catches JS errors, unhandled promise rejections, and API failures.
  Logs to Firestore clientErrors collection (max 20 per session, deduped).
  ──────────────────────────────────────────────────────────────────────────── -->
<script>
(function() {
  var SESSION_LIMIT = 20;
  var _errCount = 0;
  var _loggedMsgs = {};   // dedupe within session: msg → true
  var _ready = false;     // db available after Firebase init
  var _queue = [];        // buffer errors that arrive before db is ready

  function simplifyUA() {
    var ua = navigator.userAgent;
    var os  = /Android/.test(ua) ? 'Android' : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Unknown';
    var br  = /EdgA?\//.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Other';
    return br + ' / ' + os;
  }

  function writeError(payload) {
    if (_errCount >= SESSION_LIMIT) return;
    var key = payload.type + '|' + payload.message.slice(0, 80);
    if (_loggedMsgs[key]) return; // same error already logged this session
    _loggedMsgs[key] = true;
    _errCount++;
    payload.browser    = simplifyUA();
    payload.sessionId  = (sessionStorage.getItem('hc_analytics_sid') || 'unknown');
    payload.url        = window.location.hash || '/';
    payload.timestamp  = Date.now();
    if (_ready && window._hcDb) {
      window._hcDb.collection('clientErrors').add(payload).catch(function(){});
    } else {
      _queue.push(payload);
    }
  }

  // Flush queue once Firebase is ready
  window._hcFlushErrorQueue = function(db) {
    _ready = true;
    window._hcDb = db;
    _queue.splice(0).forEach(function(p) {
      db.collection('clientErrors').add(p).catch(function(){});
    });
  };

  // JS errors
  window.onerror = function(msg, src, line, col, err) {
    if (!msg || String(msg).indexOf('Script error') > -1) return false; // cross-origin noise
    writeError({
      type:    'js_error',
      message: String(msg).slice(0, 300),
      source:  (src || '').replace(/.*\//, '') + (line ? ':' + line : ''),
    });
    return false;
  };

  // Unhandled promise rejections
  window.addEventListener('unhandledrejection', function(e) {
    var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason || 'Unhandled rejection');
    writeError({
      type:    'promise_rejection',
      message: msg.slice(0, 300),
      source:  '',
    });
  });

  // Expose log function for API errors
  window._logApiError = function(endpoint, status, message) {
    writeError({
      type:     'api_error',
      message:  (message || 'HTTP ' + status).slice(0, 300),
      source:   endpoint,
      status:   status || 0,
    });
  };
})();
</script>
