<style>
  :root {
    --bg: #F0F3FA; --surface: #FFFFFF; --surface2: #F8FAFC;
    --border: #E4E8F0; --text-1: #0F172A; --text-2: #475569; --text-3: #94A3B8;
    --topbar-bg: #FFFFFF; --hover: rgba(0,0,0,0.04);
    --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.1); --shadow-lg: 0 8px 40px rgba(0,0,0,0.18);
    --accent: #E50914; --accent2: #B0060F;
    --accent-dark: #d44060;
    --hc-gradient: linear-gradient(135deg, #d20820, #6d0550);
    --hc-gradient-h: linear-gradient(90deg, #d20820, #6d0550);
    --font-display: 'Manrope', 'Inter', system-ui, sans-serif;
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #050506; --surface: #0f0f11; --surface2: #17181B;
    --border: #2E3036; --text-1: #ECEDF0; --text-2: #A8ABB2; --text-3: #54575F;
    --topbar-bg: transparent; --hover: rgba(255,255,255,0.05);
    --shadow: 0 1px 4px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    --shadow-md: 0 4px 24px rgba(0,0,0,0.5); --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
    --accent: #d44060; --accent2: #a82840;
  }
  * { font-family: 'Inter', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
  html { overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text-1); transition: background 0.25s, color 0.25s; overscroll-behavior: none; }
  [data-theme="dark"] body {
    background:
      radial-gradient(ellipse 100% 55% at 50% 0%,  rgba(229,9,20,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 70%  40% at 85% 20%,  rgba(255,214,107,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 60%  35% at 15% 65%,  rgba(176,6,15,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50%  30% at 80% 90%,  rgba(229,9,20,0.06) 0%, transparent 55%),
      linear-gradient(180deg, #0C0C0E 0%, #07070A 40%, #050506 100%);
    background-attachment: fixed;
  }
  html { background: var(--bg); }
  [data-theme="dark"] html { background: #050506; }
  .gradient-text { background: var(--hc-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .btn-primary { background: var(--hc-gradient) !important; box-shadow: 0 2px 8px rgba(210,8,32,0.25); color: #fff !important; border: none; cursor: pointer; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: var(--surface); border: 1.5px solid var(--border); color: var(--text-1); cursor: pointer; }
  .btn-ghost:hover { background: var(--hover); }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
  .topbar { background: var(--topbar-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0 var(--border), 0 4px 24px rgba(0,0,0,0.04); }
  .hero-gradient {
    background:
      radial-gradient(ellipse 80% 100% at 0% 50%,   rgba(210,8,32,0.55)  0%, transparent 52%),
      radial-gradient(ellipse 80% 100% at 100% 50%, rgba(109,5,80,0.55)  0%, transparent 52%),
      radial-gradient(ellipse 60% 50%  at 50% 0%,   rgba(155,6,55,0.18)  0%, transparent 60%),
      #050506;
    position: relative; overflow: hidden;
  }
  .category-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .article-card:hover { background: var(--hover); }
  .like-btn:hover { background: #DCFCE7; color: #16A34A; border-color: #16A34A; }
  .dislike-btn:hover { background: #FEE2E2; color: #DC2626; border-color: #DC2626; }
  .like-active { background: #DCFCE7 !important; color: #16A34A !important; border-color: #16A34A !important; }
  .dislike-active { background: #FEE2E2 !important; color: #DC2626 !important; border-color: #DC2626 !important; }
  [data-theme="dark"] .like-btn:hover, [data-theme="dark"] .like-active { background: rgba(22,163,74,0.15) !important; }
  [data-theme="dark"] .dislike-btn:hover, [data-theme="dark"] .dislike-active { background: rgba(220,38,38,0.15) !important; }
  .video-card:hover .play-overlay { opacity: 1; }
  .play-overlay { opacity: 0; transition: opacity 0.2s; }
  .search-input:focus, .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent) !important; box-shadow: none; }
  [data-theme="dark"] .search-input:focus, [data-theme="dark"] .form-input:focus, [data-theme="dark"] .form-select:focus, [data-theme="dark"] .form-textarea:focus { border-color: rgba(229,9,20,0.5) !important; }
  /* Nugget chat bubble — hoichoi logo fills full circle */
  #chat-bubble-nugget-chat-widget svg:not([fill]) {
    max-width: none !important;
    max-height: none !important;
    width: 100% !important;
    height: 100% !important;
  }
  /* Chevron state — grey circle with black arrow */
  #chat-bubble-nugget-chat-widget:has(svg[fill="#000000"]) {
    background: #E2E8F0 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
  }
  #chat-bubble-nugget-chat-widget svg[fill="#000000"] {
    max-width: 32px !important;
    max-height: 32px !important;
    width: 32px !important;
    height: 32px !important;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.25s ease; }
  @keyframes viewEnter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .view-enter { animation: viewEnter 320ms cubic-bezier(0.22,1,0.36,1) both; }
  /* Staggered entry — used on AI page hero elements */
  .stagger-1 { animation: viewEnter 500ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:   0ms; }
  .stagger-2 { animation: viewEnter 500ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:  70ms; }
  .stagger-3 { animation: viewEnter 500ms cubic-bezier(0.22,1,0.36,1) both; animation-delay: 140ms; }
  .stagger-4 { animation: viewEnter 500ms cubic-bezier(0.22,1,0.36,1) both; animation-delay: 220ms; }
  .stagger-5 { animation: viewEnter 500ms cubic-bezier(0.22,1,0.36,1) both; animation-delay: 310ms; }
  .tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .tag-new { background: #EFF6FF; color: #2563EB; }
  .tag-popular { background: #FFF7ED; color: #EA580C; }
  [data-theme="dark"] .tag-new { background: rgba(37,99,235,0.15); color: #60A5FA; }
  [data-theme="dark"] .tag-popular { background: rgba(234,88,12,0.15); color: #FB923C; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px; }
  .modal-box { background: var(--surface); border-radius: 18px; width: 100%; max-width: 600px; box-shadow: var(--shadow-lg); margin: auto; }
  .form-input, .form-select, .form-textarea {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text-1); font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s; font-family: 'Inter', sans-serif;
  }
  .form-select { appearance: none; -webkit-appearance: none; cursor: pointer; }
  .form-textarea { resize: vertical; min-height: 100px; }
  .form-label { color: var(--text-2); font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
  .form-label .req { color: var(--accent); margin-left: 2px; }
  .field-error { color: #DC2626; font-size: 12px; margin-top: 4px; }
  .upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .upload-zone:hover, .upload-zone.dragging { border-color: var(--accent); background: rgba(210,8,32,0.04); }
  .upload-zone.has-file { border-color: #16A34A; background: rgba(22,163,74,0.04); border-style: solid; }
  .progress-bar { height: 3px; background: var(--hc-gradient); border-radius: 999px; transition: width 0.3s; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes blink-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .slide-up { animation: slideUp 0.3s ease; }
  @keyframes askai-spin { to { transform: rotate(360deg); } }
  @keyframes askai-blob-float { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(18px,-28px) scale(1.05); } 66% { transform:translate(-14px,18px) scale(0.97); } }
  @keyframes askai-orb-spin { to { transform: rotate(360deg); } }
  @keyframes askai-orb-pulse { 0%,100% { transform:scale(0.88); opacity:0.85; } 50% { transform:scale(1.12); opacity:1; } }
  .aurora-blob { animation: askai-blob-float 18s ease-in-out infinite; }
  .aurora-2 { animation-duration: 22s; animation-delay: -7s; }
  .aurora-3 { animation-duration: 27s; animation-delay: -13s; }
  .hc-quick-pill { transition: all 160ms var(--ease-out, ease); }
  .hc-quick-pill:hover { background: rgba(229,9,20,0.12) !important; border-color: rgba(229,9,20,0.5) !important; color: #fff !important; transform: translateY(-1px); }
  @keyframes aiDot { 0%,80%,100% { transform: scale(0.55); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }
  .ai-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: aiDot 1.4s ease-in-out infinite; }
  .ai-dot:nth-child(2) { animation-delay: 0.18s; }
  .ai-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes aiAnswerIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .ai-answer-in { animation: aiAnswerIn 0.4s ease forwards; }
  @keyframes aiLoaderSpin { to { transform: rotate(360deg); } }
  @keyframes aiGlowPulse { 0%,100% { opacity:0.35; transform:scale(0.8); } 50% { opacity:1; transform:scale(1.2); } }
  @keyframes aiScanLine { 0% { transform:translateX(-100%); opacity:0; } 40%,60% { opacity:1; } 100% { transform:translateX(100%); opacity:0; } }
  .ai-loader-ring { position:absolute; inset:0; border-radius:50%; border:2.5px solid transparent; border-top-color:#d20820; border-right-color:rgba(109,5,80,0.5); animation:aiLoaderSpin 0.95s linear infinite; box-shadow:0 0 16px rgba(210,8,32,0.4); }
  .ai-hero-input::placeholder { color:rgba(255,255,255,0.28); }
  .ai-hero-input:focus { border-color:rgba(229,9,20,0.4) !important; box-shadow:none !important; outline:none; }
  /* Responsive article layout */
  .article-grid { display: grid; grid-template-columns: 1fr 300px; gap: 32px; align-items: start; max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px; }
  .article-sidebar { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 860px) {
    .article-grid { grid-template-columns: 1fr; }
    .article-sidebar { position: static; }
  }
  /* ── Topbar redesign ─────────────────────────────────────────────────────── */
  .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 0 48px; height: 56px; display: flex; align-items: center; overflow: hidden; position: relative; }
  @media (max-width: 1023px) { .topbar-inner { padding: 0 24px; height: 50px; } }
  @media (max-width: 479px)  { .topbar-inner { padding: 0 16px; } }

  /* ── Mobile fixes ────────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    /* Home hero */
    .hero-gradient { padding: 32px 16px 36px !important; }
    .hero-inner { padding: 0 !important; }
    .hero-search-bar { padding: 5px 5px 5px 14px !important; }
    .search-askai-btn { display: none !important; }

    /* Home categories */
    .category-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }

    /* AI page — watermark scale down so it doesn't flood the screen */
    .askai-watermark { font-size: 140px !important; right: -20px !important; top: 20px !important; }

    /* AI page — hero tighter on mobile */
    .askai-hero { padding: 32px 16px 24px !important; }

    /* AI page — Ask button: compact on mobile, hide label keep icon */
    .askai-ask-btn { padding: 10px 12px !important; }
    .askai-ask-label { display: none !important; }
    /* Home search button: icon only on mobile */
    .home-search-btn { padding: 0 !important; width: 40px !important; height: 40px !important; justify-content: center !important; }
    .home-search-btn-label { display: none !important; }

    /* AI page — feature cards single column */
    .askai-caps-grid { grid-template-columns: 1fr !important; }

    /* AI page — suggestion pills wrap tightly */
    .askai-suggest-row { gap: 6px !important; }
  }
  /* hoichoi logo — CSS gradient text, no SVG whitespace */
  .topbar-logo { font-family: var(--font-display),-apple-system,BlinkMacSystemFont,sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.8px; line-height: 1; white-space: nowrap; background: var(--hc-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; flex-shrink: 0; }
  [data-theme="dark"] .topbar { background: rgba(5,5,6,0.72) !important; backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,0.07) !important; }
  [data-theme="dark"] .topbar-divider { background: rgba(255,255,255,0.15); }
  [data-theme="dark"] .topbar-brand-title { color: rgba(255,255,255,0.55); }
  @media (max-width: 479px) { .topbar-logo { font-size: 20px; } }
  /* Divider between logo and title */
  .topbar-divider { width: 1px; height: 18px; background: #D1D5DB; flex-shrink: 0; }
  /* Brand title — visibly navy, not black */
  .topbar-brand-title { color: #475569; font-size: 20px; font-weight: 400; letter-spacing: -0.4px; white-space: nowrap; line-height: 1; flex-shrink: 0; }
  [data-theme="dark"] .topbar-brand-title { color: #8896AB; }
  @media (max-width: 479px) { .topbar-brand-title { font-size: 16px; } }
  /* Desktop nav */
  .topbar-nav { display: none; align-items: center; gap: 0; position: absolute; left: 50%; transform: translateX(-50%); }
  @media (min-width: 1024px) { .topbar-nav { display: flex; } }
  .topbar-nav-link { color: #475569 !important; background: transparent !important; border: none; font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; letter-spacing: -0.1px; transition: color 0.15s, background 0.15s; }
  .topbar-nav-link:hover { color: #0F172A !important; background: rgba(0,0,0,0.05) !important; }
  [data-theme="dark"] .topbar-nav-link { color: #8896AB !important; }
  [data-theme="dark"] .topbar-nav-link:hover { color: #E2E8F5 !important; background: rgba(255,255,255,0.06) !important; }
  /* Right controls */
  .topbar-chat { display: none !important; }
  .topbar-lang-text { display: none; }
  @media (min-width: 1024px) { .topbar-lang-text { display: inline; } }
  .topbar-btn-text { display: none; }
  @media (min-width: 768px) { .topbar-btn-text { display: inline; } }
  /* Ticket button — hide entirely on small phones, icon-only on tablets */
  .topbar-ticket { display: flex !important; }
  @media (max-width: 479px) { .topbar-ticket { display: none !important; } }
  /* Language button — desktop only */
  @media (max-width: 1023px) { .topbar-lang { display: none !important; } }
  /* Hamburger — tablet + mobile only */
  .topbar-hamburger { display: none !important; width: 36px; height: 36px; align-items: center; justify-content: center; flex-shrink: 0; }
  @media (max-width: 1023px) { .topbar-hamburger { display: flex !important; } }
  /* Mobile dropdown menu */
  .topbar-mobile-menu { border-top: 1px solid var(--border); background: var(--topbar-bg); padding: 6px 0 14px; }
  .topbar-mobile-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 13px 24px; background: transparent; border: none; color: var(--text-1); font-size: 15px; font-weight: 500; cursor: pointer; letter-spacing: -0.2px; transition: background 0.12s; }
  .topbar-mobile-menu button:hover { background: var(--hover); }
  /* Sticky sidebar offset */
  .article-sidebar { position: sticky; top: 64px; }
  /* Active nav link */
  .topbar-nav-link-active { color: #0F172A !important; background: rgba(0,0,0,0.06) !important; font-weight: 500; }
  [data-theme="dark"] .topbar-nav-link-active { color: #E2E8F5 !important; background: rgba(255,255,255,0.08) !important; }
  /* Get Started step card — responsive */
  .getstarted-step { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
  @media (max-width: 640px) {
    .getstarted-step { flex-wrap: wrap; padding: 16px; gap: 10px; }
    .getstarted-step-content { flex: 1 1 100% !important; }
    .getstarted-btn { flex: 1 1 100% !important; justify-content: center !important; text-align: center; }
  }
  /* Support bar — responsive */
  .support-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; }
  .support-bar-btns { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  @media (max-width: 640px) {
    .support-bar { flex-direction: column; align-items: stretch; gap: 10px; }
    .support-bar-btns { flex-direction: column; gap: 8px; }
    .support-bar-btns button { width: 100% !important; justify-content: center !important; }
  }
  /* Live search dropdown */
  .search-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 200; overflow: hidden; max-height: 360px; overflow-y: auto; }
  .search-dropdown-item:hover { background: var(--hover); }
  /* Category card grid min size on small screens */
  @media (max-width: 480px) {
    .category-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .video-grid { grid-template-columns: 1fr !important; }
  }
  /* Dark mode video category tag */
  [data-theme="dark"] .tag-category { background: rgba(37,99,235,0.15) !important; color: #60A5FA !important; }
  /* ── AI Answer — cinematic page-wide treatment ──────────────────────── */
  [data-view="ai"] .topbar { background: rgba(6,3,3,0.92) !important; border-bottom: 1px solid rgba(180,80,30,0.35) !important; backdrop-filter: blur(20px) !important; -webkit-backdrop-filter: blur(20px) !important; }
  [data-view="ai"] footer { display: none; }
  @keyframes askai-dust-drift { 0% { transform:translate(0,0); opacity:0; } 20% { opacity:0.9; } 80% { opacity:0.6; } 100% { transform:translate(40px,-120px); opacity:0; } }
  .askai-dust { animation: askai-dust-drift linear infinite; }
  /* ── Category cards — dark glassmorphism ──────────────────────────────── */
  .hc-cat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); transition: all 200ms ease; cursor: pointer; position: relative; overflow: hidden; }
  .hc-cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  [data-theme="dark"] .hc-cat-card { background: rgba(255,255,255,0.04) !important; border: 1px solid rgba(255,255,255,0.08) !important; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: none !important; }
  [data-theme="dark"] .hc-cat-card:hover { background: rgba(255,255,255,0.07) !important; border-color: rgba(229,9,20,0.35) !important; transform: translateY(-2px); }
  /* Icon container */
  .hc-cat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; flex-shrink: 0; }
  [data-theme="dark"] .hc-cat-icon { background: rgba(229,9,20,0.18) !important; border: 1px solid rgba(229,9,20,0.28) !important; color: #FFD66B !important; }
  /* Article count */
  .hc-cat-count { font-size: 12px; color: var(--text-3); }
  [data-theme="dark"] .hc-cat-count { background: var(--hc-gradient-h); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 600; }

async function fetchNuggetToken() {
  var uid = sessionStorage.getItem('hc_nugget_uid');
  if (!uid) {
    uid = Date.now().toString(36) + Math.random().toString(36).slice(2);
    sessionStorage.setItem('hc_nugget_uid', uid);
  }
  var cached = sessionStorage.getItem('hc_nugget_token');
  if (cached) return cached;
  var res = await fetch('/api/nugget-token?uid=' + encodeURIComponent(uid));
  var data = await res.json();
  if (data.accessToken) {
    sessionStorage.setItem('hc_nugget_token', data.accessToken);
    return data.accessToken;
  }
  throw new Error('Nugget token unavailable');
}

// Detects whether the page is running inside a native app WebView.
// Priority: 1) ?source=app URL param  2) Android WebView UA  3) iOS WKWebView UA
function isNativeWebView() {
  try {
    if (new URLSearchParams(window.location.search).get('source') === 'app') return true;
    var ua = navigator.userAgent;
    var isAndroidWV = /Android/.test(ua) && /wv/.test(ua);
    var isIOSWV     = /iPhone|iPad|iPod/.test(ua) && !/Safari/.test(ua);
    return isAndroidWV || isIOSWV;
  } catch(_) { return false; }
}

// Called when user taps "Chat with Us"
// • WebView  → signals the native app to open its chat SDK
// • Browser  → opens WhatsApp with a pre-filled message
function openChatWithUs() {
  if (isNativeWebView()) {
    // Try React Native bridge first, then Android JS interface, then URL scheme
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ action: 'open_chat' }));
    } else if (window.HoichoiApp && typeof window.HoichoiApp.openChat === 'function') {
      window.HoichoiApp.openChat();
    } else {
      // Universal fallback — native app intercepts this URL scheme
      window.location.href = 'hoichoi://open_chat';
    }
  } else {
    // Web browser → WhatsApp
    window.open(
      'https://wa.me/916293666600?text=' + encodeURIComponent('Hi, I need help'),
      '_blank', 'noopener,noreferrer'
    );
  }
}

}

const FEEDBACK_REASONS = [
  { value: 'inaccurate',  labelEn: 'Inaccurate information',  labelBn: 'তথ্য সঠিক নয়' },

// ── Article Feedback (Firebase-wired) ─────────────────────────────────────────
const ArticleFeedback = ({ articleId, initialLikes, initialDislikes, lang = 'en' }) => {
  const S = STRINGS[lang];
  const [vote, setVote] = useState(() => localStorage.getItem(`hc_vote_${articleId}`));
  const [likes, setLikes] = useState(initialLikes);
  const [dislikes, setDislikes] = useState(initialDislikes);
  const [showFeedback, setShowFeedback] = useState(false);
  const [reason, setReason] = useState('');
  const [feedback, setFeedback] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [loading, setLoading] = useState(false);

  // Fetch live counts from Firestore on mount
  useEffect(() => {
    db.collection('articleFeedback').doc(articleId).get()
      .then(doc => {
        if (doc.exists) {
          const d = doc.data();
          if (d.likes !== undefined)    setLikes(d.likes);
          if (d.dislikes !== undefined) setDislikes(d.dislikes);
        }
      })
      .catch(() => {});
  }, [articleId]);

  const handleVote = async (v) => {
    if (loading) return;
    const prevVote = vote;
    const newVote = prevVote === v ? null : v;

    // Optimistic UI
    if (prevVote === 'like')    setLikes(l => l - 1);
    if (prevVote === 'dislike') setDislikes(d => d - 1);
    if (newVote === 'like')     setLikes(l => l + 1);
    if (newVote === 'dislike')  setDislikes(d => d + 1);
    setVote(newVote);
    if (newVote === 'dislike') setShowFeedback(true);
    else setShowFeedback(false);
    if (newVote) localStorage.setItem(`hc_vote_${articleId}`, newVote);
    else localStorage.removeItem(`hc_vote_${articleId}`);

    // Firestore update
    setLoading(true);
    try {
      const ref = db.collection('articleFeedback').doc(articleId);
      const inc = firebase.firestore.FieldValue.increment;
      const updates = {};
      if (prevVote === 'like')    updates.likes    = inc(-1);
      if (prevVote === 'dislike') updates.dislikes = inc(-1);
      if (newVote === 'like')     updates.likes    = inc(1);
      if (newVote === 'dislike')  updates.dislikes = inc(1);
      if (Object.keys(updates).length > 0) await ref.set(updates, { merge: true });
    } catch (e) {}
    setLoading(false);
  };

  const submitFeedback = async () => {
    try {
      await db.collection('articleFeedbackText').add({
        articleId, reason, feedback, vote, createdAt: Date.now(),
      });
    } catch (e) {}
    setSubmitted(true);
    setShowFeedback(false);
  };

  if (submitted) return (
    <div style={{ borderTop: '1.5px solid var(--border)', paddingTop: 24, marginTop: 32 }}>
      <p style={{ color: '#16A34A', fontSize: 13, fontWeight: 500 }}>
        <Icon name="checkCircle" size={14} style={{ marginRight: 6 }} /> {S.feedbackThanks}
      </p>
    </div>
  );

  return (
    <div style={{ borderTop: '1.5px solid var(--border)', paddingTop: 24, marginTop: 32 }}>
      <p style={{ color: 'var(--text-2)', fontSize: 14, fontWeight: 500, marginBottom: 12 }}>{S.wasHelpful}</p>
      <div className="flex items-center gap-3 flex-wrap">
        <button onClick={() => handleVote('like')}
          className={`like-btn flex items-center gap-2 px-4 py-2 rounded-lg border text-sm font-medium cursor-pointer transition-all ${vote === 'like' ? 'like-active' : ''}`}
          style={{ background: 'var(--surface2)', color: 'var(--text-2)', borderColor: 'var(--border)' }}>
          <Icon name="thumbUp" size={15} /> {S.yesHelped}
          <span style={{ color: 'var(--text-3)', marginLeft: 2 }}>({likes})</span>
        </button>
        <button onClick={() => handleVote('dislike')}
          className={`dislike-btn flex items-center gap-2 px-4 py-2 rounded-lg border text-sm font-medium cursor-pointer transition-all ${vote === 'dislike' ? 'dislike-active' : ''}`}
          style={{ background: 'var(--surface2)', color: 'var(--text-2)', borderColor: 'var(--border)' }}>
          <Icon name="thumbDown" size={15} /> {S.notReally}
          <span style={{ color: 'var(--text-3)', marginLeft: 2 }}>({dislikes})</span>
        </button>
      </div>
      {vote === 'like' && !showFeedback && (
        <p style={{ color: '#16A34A', fontSize: 13, marginTop: 10, fontWeight: 500 }}>
          <Icon name="check" size={13} style={{ marginRight: 4 }} /> {S.thanksFeedback}
        </p>
      )}
      {showFeedback && (
        <div className="fade-in" style={{ marginTop: 14, maxWidth: 480 }}>
          <p style={{ color: 'var(--text-2)', fontSize: 13, fontWeight: 500, marginBottom: 8 }}>{S.feedbackReasonLabel}</p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 14 }}>
            {FEEDBACK_REASONS.map(r => {
              const label = lang === 'bn' ? r.labelBn : r.labelEn;
              const selected = reason === r.value;
              return (
                <button key={r.value} type="button" onClick={() => setReason(r.value)}
                  style={{
                    padding: '6px 14px', borderRadius: 20, fontSize: 13, fontWeight: 500, cursor: 'pointer',
                    border: selected ? '1.5px solid var(--accent)' : '1.5px solid var(--border)',
                    background: selected ? 'rgba(210,8,32,0.08)' : 'var(--surface2)',
                    color: selected ? 'var(--accent)' : 'var(--text-2)',
                    transition: 'all 0.15s',
                  }}>
                  {label}
                </button>
              );
            })}
          </div>
          <p style={{ color: 'var(--text-2)', fontSize: 13, marginBottom: 8 }}>{S.whatMissing}</p>
          <textarea value={feedback} onChange={e => setFeedback(e.target.value)}
            placeholder={S.feedbackPlaceholder}
            rows={3} className="form-textarea" style={{ maxWidth: 480 }} />
          <div className="flex gap-2 mt-2">
            <button onClick={submitFeedback} disabled={!reason}
              className="btn-primary px-4 py-2 rounded-lg text-sm font-medium"
              style={{ opacity: reason ? 1 : 0.45, cursor: reason ? 'pointer' : 'not-allowed' }}>
              {S.submitFeedback}
            </button>
            <button onClick={() => { setSubmitted(true); setShowFeedback(false); }}
              style={{ color: 'var(--text-3)', background: 'transparent', border: 'none', fontSize: 13, cursor: 'pointer' }}>
              {S.skipFeedback}
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

// ── Ticket Modal ──────────────────────────────────────────────────────────────
const TicketModal = ({ onClose, lang = 'en' }) => {
  const S = STRINGS[lang];
  const [form, setForm] = useState({
    name: '', email: '', countryCode: '+91', phone: '',
    category: '', subcategory: '', device: '', description: '',
  });
  const [file, setFile] = useState(null);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [ticketId, setTicketId] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();

  const selectedCat = FORM_CATEGORIES.find(c => c.id === form.category);

  const needsDevice = selectedCat && (
    selectedCat.deviceTriggerAll ||
    (selectedCat.deviceTriggerSubs || []).includes(form.subcategory)
  );

  const needsAttachment = selectedCat && form.subcategory &&
    (selectedCat.attachmentTriggerSubs || []).includes(form.subcategory);

  const set = (k, v) => {
    setForm(f => ({ ...f, [k]: v }));
    setErrors(e => ({ ...e, [k]: '' }));
  };

  const handleCategoryChange = (v) => {
    setForm(f => ({ ...f, category: v, subcategory: '', device: '' }));
    setErrors(e => ({ ...e, category: '', subcategory: '', device: '' }));
    setFile(null);
  };

  const handleFile = (f) => {
    if (!f) return;
    const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'application/pdf'];
    if (!allowed.includes(f.type)) { setErrors(e => ({ ...e, file: S.errFileType })); return; }
    if (f.size > 5 * 1024 * 1024)  { setErrors(e => ({ ...e, file: S.errFileSize })); return; }
    setFile(f);
    setErrors(e => ({ ...e, file: '' }));
  };

  const validate = () => {
    const e = {};
    if (!form.name.trim())        e.name = S.errName;
    if (!form.email.trim())       e.email = S.errEmail;
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = S.errEmailInvalid;
    if (!form.phone.trim())       e.phone = S.errPhone;
    else if (!/^\d{6,15}$/.test(form.phone.replace(/\s/g,''))) e.phone = S.errPhoneInvalid;
    if (!form.category)           e.category = S.errCategory;
    if (!form.subcategory)        e.subcategory = S.errSubcategory;
    if (needsDevice && !form.device) e.device = S.errDevice;
    if (!form.description.trim()) e.description = S.errDescription;
    else if (form.description.trim().length < 20) e.description = S.errDescriptionMin;
    if (needsAttachment && !file) e.file = S.errAttachment;
    return e;
  };

  const toBase64 = (f) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload  = () => res(reader.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(f);
  });

  const handleSubmit = async () => {
    const e = validate();
    if (Object.keys(e).length > 0) { setErrors(e); return; }
    setSubmitting(true);
    try {
      let attachment = null;
      if (file) {
        const base64 = await toBase64(file);
        attachment = { base64, name: file.name, type: file.type };
      }
      const payload = {
        name: form.name.trim(),
        email: form.email.trim(),
        phone: `${form.countryCode} ${form.phone.trim()}`,
        category: selectedCat?.label || form.category,
        subcategory: form.subcategory,
        device: form.device || null,
        description: form.description.trim(),
        attachment,
      };
      const res = await fetch('/api/create-ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        setErrors({ submit: data.error || S.errSubmit });
        setSubmitting(false);
        return;
      }
      setTicketId(data.ticket_id || null);
      setSubmitted(true);
    } catch (err) {
      setErrors({ submit: S.errSubmit });
    }
    setSubmitting(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box slide-up">
        {/* Header */}
        <div style={{ padding: '20px 24px 16px', borderBottom: '1.5px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div>
            <p style={{ color: 'var(--text-1)', fontWeight: 700, fontSize: 17 }}>{S.ticketTitle}</p>
            <p style={{ color: 'var(--text-3)', fontSize: 12, marginTop: 2 }}>{S.ticketSubtitle}</p>
          </div>
          <button onClick={onClose} style={{ background: 'var(--surface2)', border: '1.5px solid var(--border)', borderRadius: 8, width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: 'var(--text-2)' }}>
            <Icon name="x" size={16} />
          </button>
        </div>

        {submitted ? (
          <div style={{ padding: '48px 24px', textAlign: 'center' }}>
            <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'rgba(22,163,74,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', color: '#16A34A' }}>
              <Icon name="checkCircle" size={32} />
            </div>

// ── Content renderer ──────────────────────────────────────────────────────────
const inlineHtml = (line) =>
  line
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, href) => {
      const isExternal = /^https?:\/\//.test(href);
      const url = isExternal ? href : `#article/${href}/`;
      const attrs = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
      return `<a href="${url}"${attrs} style="color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500">${txt}</a>`;
    });

const renderContent = (text) => {
  if (!text) return <p style={{ color: 'var(--text-2)' }}>Article content coming soon.</p>;
  return text.split('\n').map((line, i) => {
    // ## Section heading
    if (/^##\s+/.test(line))
      return <h2 key={i} style={{ color: 'var(--text-1)', fontWeight: 800, fontSize: 17, marginTop: 28, marginBottom: 8, letterSpacing: '-0.2px' }}>{line.replace(/^##\s+/, '')}</h2>;
    // ### Sub-heading
    if (/^###\s+/.test(line))
      return <h3 key={i} style={{ color: 'var(--text-1)', fontWeight: 700, fontSize: 15, marginTop: 20, marginBottom: 6 }}>{line.replace(/^###\s+/, '')}</h3>;
    // **Full-line bold** → section heading (existing convention)
    if (/^\*\*[^*]+\*\*$/.test(line.trim()))
      return <h3 key={i} style={{ color: 'var(--text-1)', fontWeight: 700, fontSize: 15, marginTop: 24, marginBottom: 8 }}>{line.trim().slice(2,-2)}</h3>;
    if (line.startsWith('---'))
      return <hr key={i} style={{ borderColor: 'var(--border)', marginTop: 24, marginBottom: 20 }} />;
    if (/^\d+\./.test(line))
      return <div key={i} style={{ display: 'flex', gap: 10, marginBottom: 8 }}>
        <span style={{ background: 'var(--hc-gradient)', color: '#fff', width: 22, height: 22, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, flexShrink: 0, marginTop: 1 }}>
          {line.match(/^(\d+)/)[1]}
        </span>
        <p style={{ color: 'var(--text-1)', fontSize: 14, lineHeight: 1.65, margin: 0 }}
          dangerouslySetInnerHTML={{ __html: inlineHtml(line.replace(/^\d+\.\s*/,'')) }} />
      </div>;
    if (line.startsWith('- '))
      return <div key={i} style={{ display: 'flex', gap: 10, marginBottom: 6 }}>
        <span style={{ color: 'var(--accent)', fontWeight: 700, flexShrink: 0, marginTop: 1 }}>•</span>
        <p style={{ color: 'var(--text-1)', fontSize: 14, lineHeight: 1.65, margin: 0 }}
          dangerouslySetInnerHTML={{ __html: inlineHtml(line.slice(2)) }} />
      </div>;
    const calloutMatch = line.match(/^\[!?(info|warning|tip)\]\s*(.+)$/i);
    if (calloutMatch) {
      const type = calloutMatch[1].toLowerCase();
      const icons = { info: 'ℹ️', warning: '⚠️', tip: '💡' };
      return (
        <div key={i} className={`callout callout-${type}`}>
          <span style={{ fontSize: 16, flexShrink: 0, marginTop: 1 }}>{icons[type]}</span>
          <p dangerouslySetInnerHTML={{ __html: inlineHtml(calloutMatch[2]) }} />
        </div>
      );
    }
    const imgMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (imgMatch)
      return <img key={i} src={imgMatch[2]} alt={imgMatch[1]}
        style={{ maxWidth: '100%', borderRadius: 10, margin: '12px 0', display: 'block', border: '1px solid var(--border)' }} />;
    if (!line.trim()) return <div key={i} style={{ height: 6 }} />;
    return <p key={i} style={{ color: 'var(--text-1)', fontSize: 14, lineHeight: 1.75, marginBottom: 8 }}
      dangerouslySetInnerHTML={{ __html: inlineHtml(line) }} />;
  });
};

// ── Search scoring ────────────────────────────────────────────────────────────
// Returns a relevance score for one article against an array of query terms.
// Exact title match = 10pts, prefix/stem title match = 6pts (handles renew≈renewal)
// Exact body match = 1pt, prefix/stem body match = 0.5pt
// Views used only as tiebreaker in sort, not as a score factor.
const prefixMatch = (term, text) => {
  if (text.includes(term)) return false; // exact already handled
  if (term.length < 4) return false;
  return text.split(/\W+/).some(w => w.length >= 4 && (term.startsWith(w) || w.startsWith(term)));
};
const scoreArticles = (terms, allArticles) => {
  const scored = [];
  for (const a of allArticles) {
    const titleL  = (a.title   || '').toLowerCase();
    const titleBn = (a.titleBn || '').toLowerCase();
    const bodyL   = (a.content || '').toLowerCase();
    let score = 0;
    for (const t of terms) {
      const titleExact  = titleL.includes(t) || titleBn.includes(t);
      const titlePrefix = !titleExact && (prefixMatch(t, titleL) || prefixMatch(t, titleBn));
      const bodyExact   = bodyL.includes(t);
      const bodyPrefix  = !bodyExact && prefixMatch(t, bodyL);
      score += (titleExact ? 10 : 0) + (titlePrefix ? 6 : 0) + (bodyExact ? 1 : 0) + (bodyPrefix ? 0.5 : 0);
    }
    if (score === 0) continue;
    scored.push({ ...a, catId: (a.categories && a.categories[0]) || a.categoryId || a.category, _score: score });
  }
  return scored.sort((a, b) => b._score !== a._score ? b._score - a._score : (b.views || 0) - (a.views || 0));
};

const MiniSearchBar = ({ navigate, lang, allArticles, categories }) => {
  const S = STRINGS[lang];
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  const results = useMemo(() => {
    if (!query || query.trim().length < 2) return [];
    const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return scoreArticles(terms, allArticles).map(a => ({ ...a, type: 'article' }));
  }, [query, allArticles]);
  useEffect(() => { setOpen(results.length > 0); }, [results]);
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
  return (
    <div ref={ref} style={{ position: 'relative', marginBottom: 20 }}>
      <div style={{ position: 'absolute', left: 13, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-3)', zIndex: 1, pointerEvents: 'none' }}>

      <input value={query}
        onChange={e => setQuery(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter' && query.trim()) { setOpen(false); navigate({ view: 'search', query }); } }}
        onFocus={() => results.length > 0 && setOpen(true)}
        placeholder={S.searchPlaceholder}
        style={{ width: '100%', height: 42, paddingLeft: 40, paddingRight: 16, borderRadius: open ? '10px 10px 0 0' : 10, border: '1.5px solid var(--border)', fontSize: 14, color: 'var(--text-1)', background: 'var(--surface)', outline: 'none', boxSizing: 'border-box', transition: 'border-color 0.15s' }} />
      {open && (
        <div className="search-dropdown" style={{ borderTop: '1px solid var(--border)', borderRadius: '0 0 10px 10px' }}>
          {results.slice(0, 5).map((r, i) => (
            <div key={r.id} className="search-dropdown-item"
              style={{ padding: '9px 14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, borderBottom: i < Math.min(results.length, 5) - 1 ? '1px solid var(--border)' : 'none' }}

              <span style={{ fontSize: 13, color: 'var(--text-1)', flex: 1 }}>{lang === 'bn' ? (r.titleBn || r.title) : r.title}</span>
              <span style={{ fontSize: 11, color: 'var(--text-3)', flexShrink: 0 }}>{categories.find(c => c.id === r.catId)?.label}</span>
            </div>
          ))}
          {query.trim().length >= 2 && (
            <div className="search-dropdown-item"
              style={{ padding: '9px 14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, borderTop: '1px solid var(--border)' }}
              onMouseDown={() => { setOpen(false); navigate({ view: 'search', query }); }}>
              <Icon name="search" size={12} style={{ color: 'var(--accent)', flexShrink: 0 }} />
              <span style={{ fontSize: 13, color: 'var(--accent)', fontWeight: 500 }}>{S.seeAllResultsFor} "{query}" {results.length > 0 ? `(${results.length})` : ''}</span>
            </div>
          )}
          {query.trim().length >= 2 && (
            <div className="search-dropdown-item"
              style={{ padding: '9px 14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, borderTop: '1px solid var(--border)', background: 'linear-gradient(90deg, rgba(210,8,32,0.06) 0%, rgba(109,5,80,0.04) 100%)' }}

  const articleMeta = allArticles.find(a => a.id === articleId) || {};
  const [fsContent, setFsContent] = useState(null);
  const [translatedContent, setTranslatedContent] = useState(null);
  const [translating, setTranslating] = useState(false);

  useEffect(() => {
    setFsContent(null);
    setTranslatedContent(null);
    db.collection('articles').doc(articleId).get()
      .then(doc => {
        if (doc.exists && doc.data().published !== false) {
          setFsContent(doc.data());
          // Increment view counter (fire-and-forget)
          doc.ref.update({ views: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
        }
      })
      .catch(() => {});
  }, [articleId]);

  useEffect(() => {
    if (lang !== 'bn') { setTranslatedContent(null); return; }
    const rawContent = (fsContent || ARTICLE_CONTENT[articleId])?.content;
    if (!rawContent) return;
    const cacheKey = `hc_trans_${articleId}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) { setTranslatedContent(cached); return; }
    setTranslating(true);
    fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: rawContent, target: 'bn' }),
    })
      .then(r => r.json())
      .then(data => {
        if (data.translated) {
          localStorage.setItem(cacheKey, data.translated);
          setTranslatedContent(data.translated);
        }
      })
      .catch(() => {})
      .finally(() => setTranslating(false));
  }, [lang, articleId, fsContent]);

  const content = fsContent;
  const relatedIds = content?.relatedArticles || articleMeta.relatedArticles || [];
  const relatedArticles = relatedIds.map(id => {
    const found = allArticles.find(a => a.id === id);
    if (found) return { ...found, catId: (found.categories && found.categories[0]) || found.categoryId || found.category };
    for (const [cId, arts] of Object.entries(ARTICLES)) {
      const fb = arts.find(a => a.id === id);
      if (fb) return { ...fb, catId: cId };
    }
    return null;
  }).filter(Boolean);
  const title = lang === 'bn' ? (articleMeta.titleBn || content?.titleBn || content?.title) : (content?.title || articleMeta.title);

        <span>/</span>
        <span style={{ color: 'var(--text-2)' }}>{S.articleBreadcrumb}</span>

      <MiniSearchBar navigate={navigate} lang={lang} allArticles={allArticles} categories={categories} />
      <div className="article-grid" style={{ padding: 0, margin: 0, maxWidth: 'none' }}>
      <div>
        <div style={{ background: 'var(--surface)', border: '1.5px solid var(--border)', borderRadius: 16, padding: 32, boxShadow: 'var(--shadow)' }}>
          <div className="flex items-center gap-2 mb-4 flex-wrap">
            <span style={{ background: cat?.color + '18', color: cat?.color, padding: '3px 10px', borderRadius: 999, fontSize: 12, fontWeight: 600 }}>{lang === 'bn' ? (cat?.labelBn || cat?.label) : cat?.label}</span>
            {articleMeta.tag && <span className={`tag ${articleMeta.tag === 'new' ? 'tag-new' : 'tag-popular'}`}>{articleMeta.tag}</span>}
            <span style={{ color: 'var(--text-3)', fontSize: 12, marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 4 }}>
              <Icon name="clock" size={12} /> {articleMeta.readTime}
            </span>
          </div>
          <h1 style={{ color: 'var(--text-1)', fontWeight: 800, fontSize: 22, letterSpacing: '-0.3px', marginBottom: 12 }}>{title}</h1>
          <div className="flex gap-4 mb-6 pb-5 flex-wrap" style={{ borderBottom: '1px solid var(--border)' }}>
            {articleMeta.views && <span className="flex items-center gap-1.5" style={{ color: 'var(--text-3)', fontSize: 12 }}><Icon name="eye" size={13} />{(articleMeta.views/1000).toFixed(1)}K {S.viewsLabel}</span>}
            {articleMeta.likes && <span className="flex items-center gap-1.5" style={{ color: 'var(--text-3)', fontSize: 12 }}><Icon name="thumbUp" size={13} />{articleMeta.likes}</span>}
          </div>
          {!fsContent
            ? <div style={{ display: 'flex', flexDirection: 'column', gap: 10, padding: '8px 0' }}>
                {[80,60,90,50,70,40].map((w,i) => (
                  <div key={i} style={{ height: 13, width: `${w}%`, background: 'var(--surface2)', borderRadius: 6, animation: 'pulse 1.4s ease-in-out infinite', animationDelay: `${i*0.08}s` }} />

            : translating
            ? <div style={{ color: 'var(--text-3)', fontSize: 14, padding: '20px 0', display: 'flex', alignItems: 'center', gap: 8 }}>

                {S.translating}

      <div className="article-sidebar">

          <div className="flex items-center justify-between mb-4">

const SearchView = ({ query, navigate, lang, onOpenTicket, allArticles, categories, chatEnabled = true, ticketEnabled = true, autoAI = false }) => {
  const S = STRINGS[lang];
  const results = useMemo(() => {
    if (!query) return [];
    const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return scoreArticles(terms, allArticles);
  }, [query, allArticles]);

  const [aiAnswer,  setAiAnswer]  = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError,   setAiError]   = useState(null);

  // Reset AI state when query changes
  useEffect(() => { setAiAnswer(null); setAiError(null); }, [query]);

  // Auto-trigger AI if navigated with autoAI flag
  useEffect(() => {
    if (autoAI && results.length > 0 && !aiAnswer && !aiLoading) handleGetAnswer();
  }, [autoAI, results.length]);

  const handleGetAnswer = async () => {
    if (aiLoading || results.length === 0) return;
    setAiLoading(true);
    setAiError(null);
    try {
      const topArticles = results.slice(0, 3).map(a => ({
        id: a.id, title: a.title, titleBn: a.titleBn || '',
        content: (a.content || '').slice(0, 500),
      }));
      const res = await fetch('/api/ai-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, lang, articles: topArticles }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'AI search failed');
      setAiAnswer(data);
      // Log to Firestore for cost tracking
      db.collection('aiSearchLogs').add({ query, lang, inputTokens: data.inputTokens, outputTokens: data.outputTokens, cost: data.cost, timestamp: Date.now() }).catch(e => console.error('aiSearchLogs write failed:', e));
    } catch (err) {
      setAiError(err.message);
    } finally {
      setAiLoading(false);
    }
  };

  // Log search query to Firestore for analytics (debounced 1s)
  useEffect(() => {
    if (!query || query.trim().length < 2) return;
    const t = setTimeout(() => {
      db.collection('searchLogs').add({
        query: query.trim().toLowerCase(),
        hasResults: results.length > 0,
        timestamp: Date.now(),
        lang,
      }).catch(() => {});
    }, 1000);
    return () => clearTimeout(t);
  }, [query]);

  const cat = (cId) => categories.find(c => c.id === cId);
  // In autoAI mode show only the AI answer (no article list), unless AI errored
  const showArticles = !autoAI || aiError;
  return (
    <div className="fade-in" style={{ maxWidth: 900, margin: '0 auto', padding: '36px 24px 60px' }}>
      <div className="flex items-center justify-between flex-wrap gap-3" style={{ marginBottom: 24 }}>
        <p style={{ color: 'var(--text-3)', fontSize: 13 }}>
          {results.length > 0 ? S.searchResultsText(results.length, query) : S.noResultsText(query)}
        </p>
        {results.length > 0 && !aiAnswer && !autoAI && (
          <button onClick={handleGetAnswer} disabled={aiLoading}
            className="btn-primary flex items-center gap-2 rounded-xl font-semibold"
            style={{ fontSize: 13, padding: '8px 16px', opacity: aiLoading ? 0.75 : 1 }}>
            {aiLoading
              ? <><Icon name="loader" size={14} /> {S.aiSearching}</>
              : <><Icon name="sparkles" size={14} /> {S.aiGetAnswer}</>}
          </button>
        )}
      </div>

      {/* AI Answer Box */}
      {(aiAnswer || aiError) && (
        <div style={{ background: 'linear-gradient(135deg, rgba(210,8,32,0.06), rgba(109,5,80,0.06))', border: '1.5px solid rgba(210,8,32,0.18)', borderRadius: 14, padding: '18px 20px', marginBottom: 24 }}>
          <div className="flex items-center gap-2" style={{ marginBottom: 10 }}>
            <Icon name="sparkles" size={15} style={{ color: 'var(--accent)' }} />
            <span style={{ fontWeight: 700, fontSize: 13, color: 'var(--accent)' }}>{S.aiAnswerTitle}</span>
            <button onClick={() => { setAiAnswer(null); setAiError(null); }}
              style={{ marginLeft: 'auto', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-3)', padding: 0 }}>
              <Icon name="x" size={14} />
            </button>
          </div>
          {aiError
            ? <p style={{ color: 'var(--text-2)', fontSize: 13 }}>{aiError}</p>
            : <>
                <p style={{ color: 'var(--text-1)', fontSize: 14, lineHeight: 1.7, marginBottom: aiAnswer.sources?.length ? 12 : 0 }}>
                  {aiAnswer.answer || S.aiNoAnswer}
                </p>
                {aiAnswer.sources?.length > 0 && (
                  <div className="flex items-center flex-wrap gap-2">
                    <span style={{ fontSize: 11, color: 'var(--text-3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{S.aiSources}:</span>
                    {aiAnswer.sources.map(id => {
                      const a = results.find(r => r.id === id);
                      return a ? (
                        <button key={id} onClick={() => navigate({ view: 'article', articleId: id, catId: a.catId })}
                          style={{ fontSize: 12, color: 'var(--accent)', background: 'rgba(210,8,32,0.08)', border: '1px solid rgba(210,8,32,0.2)', borderRadius: 6, padding: '2px 10px', cursor: 'pointer', fontWeight: 500 }}>
                          {lang === 'bn' ? (a.titleBn || a.title) : a.title}
                        </button>
                      ) : null;
                    })}
                  </div>
                )}
              </>
          }
        </div>
      )}

      {showArticles && (results.length > 0 ? (
        <div style={{ background: 'var(--surface)', border: '1.5px solid var(--border)', borderRadius: 14, overflow: 'hidden', boxShadow: 'var(--shadow)' }}>
          {results.map((a, i) => (
            <div key={a.id} className="article-card cursor-pointer flex items-center gap-4"
              onClick={() => navigate({ view: 'article', articleId: a.id, catId: a.catId })}
              style={{ padding: '16px 20px', borderBottom: i < results.length-1 ? '1px solid var(--border)' : 'none', transition: 'background 0.15s' }}>
              <div style={{ flex: 1 }}>
                <div className="flex items-center gap-2 mb-1">
                  <span style={{ color: 'var(--text-1)', fontSize: 14, fontWeight: 600 }}>{lang === 'bn' ? a.titleBn : a.title}</span>
                  {a.tag && <span className={`tag ${a.tag === 'new' ? 'tag-new' : 'tag-popular'}`}>{a.tag}</span>}
                </div>
                <span style={{ color: 'var(--text-3)', fontSize: 12 }}>{cat(a.catId)?.label}</span>
              </div>
              <Icon name="chevronRight" size={15} style={{ color: 'var(--text-3)', flexShrink: 0 }} />
            </div>
          ))}
        </div>
      ) : (
        <div style={{ textAlign: 'center', padding: '60px 24px' }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
          <p style={{ color: 'var(--text-1)', fontWeight: 700, fontSize: 18, marginBottom: 8 }}>{S.noResultsHeading}</p>
          <p style={{ color: 'var(--text-2)', fontSize: 14, marginBottom: 28 }}>{S.tryDifferent}</p>
          <button className="btn-primary px-6 py-2.5 rounded-lg font-semibold cursor-pointer" onClick={() => navigate({ view: 'home' })}>{S.browseCategories}</button>
        </div>
      ))}
      {/* Ask AI nudge — bottom of results */}
      {results.length > 0 && (
        <div style={{ margin: '32px 0 8px', padding: '18px 22px', borderRadius: 14, background: 'linear-gradient(135deg, rgba(210,8,32,0.07), rgba(109,5,80,0.05))', border: '1px solid rgba(210,8,32,0.18)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
          <div>
            <p style={{ fontWeight: 600, fontSize: 14, color: 'var(--text-1)', marginBottom: 2 }}>Not finding what you need?</p>
            <p style={{ fontSize: 13, color: 'var(--text-2)' }}>Let AI read the articles and answer directly.</p>
          </div>
          <button onClick={() => navigate({ view: 'ai-answer', query })}
            style={{ background: 'var(--hc-gradient)', color: '#fff', border: 'none', borderRadius: 10, padding: '9px 18px', fontWeight: 700, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 7, boxShadow: '0 4px 14px rgba(210,8,32,0.3)', flexShrink: 0 }}>
            <Icon name="sparkles" size={14} /> Ask AI →
          </button>
        </div>
      )}
      <div style={{ marginTop: 24 }}><SupportBar compact onOpenTicket={onOpenTicket} lang={lang} /></div>
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────────────────
// ── Hash routing helpers ──────────────────────────────────────────────────────
// ── Answer renderer — styled steps, bullets, bold ────────────────────────────
const renderAnswer = (text) => {
  if (!text) return null;
  const toBold = (s) => s.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fff;font-weight:700">$1</strong>');
  // Normalise inline steps: "foo 1. bar 2. baz" → proper newlines
  const normalised = text
    .replace(/\s+(\d+[.)]\s)/g, '\n$1')  // split before each "1. " "2) " etc
    .replace(/\s+(•|-|\*)\s/g, '\n$1 '); // split before inline bullets too
  const lines = normalised.split('\n').map(l => l.trim()).filter(Boolean);
  const out = [];
  let stepNum = 0;
  let listType = null;
  let listItems = [];

  const flushList = () => {
    if (!listItems.length) return;
    if (listType === 'ol') {
      out.push(
        React.createElement('div', { key: `ol-${out.length}`, style: { display: 'flex', flexDirection: 'column', gap: 2, margin: '10px 0 14px' } },
          listItems.map((item, i) =>
            React.createElement('div', { key: i, style: { display: 'flex', gap: 14, alignItems: 'flex-start', padding: '10px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', borderBottom: i < listItems.length - 1 ? '1px solid rgba(255,255,255,0.05)' : 'none' } },
              React.createElement('span', {
                style: { fontSize: 12, fontWeight: 700, color: 'rgba(255,255,255,0.28)', flexShrink: 0, minWidth: 18, paddingTop: 2, letterSpacing: '0.02em', fontVariantNumeric: 'tabular-nums' }
              }, `0${i + 1}`),
              React.createElement('span', {
                style: { color: 'rgba(255,255,255,0.88)', fontSize: 15, lineHeight: 1.7 },
                dangerouslySetInnerHTML: { __html: toBold(item) }
              })
            )
          )
        )
      );
    } else {
      out.push(
        React.createElement('div', { key: `ul-${out.length}`, style: { display: 'flex', flexDirection: 'column', gap: 6, margin: '8px 0 12px' } },
          listItems.map((item, i) =>
            React.createElement('div', { key: i, style: { display: 'flex', gap: 12, alignItems: 'flex-start', padding: '8px 0' } },
              React.createElement('div', {
                style: { width: 5, height: 5, borderRadius: '50%', flexShrink: 0, marginTop: 8, background: 'rgba(255,255,255,0.3)' }
              }),
              React.createElement('span', {
                style: { color: 'rgba(255,255,255,0.88)', fontSize: 15, lineHeight: 1.7 },
                dangerouslySetInnerHTML: { __html: toBold(item) }
              })
            )
          )
        )
      );
    }
    listItems = []; listType = null;
  };

  lines.forEach((line, i) => {
    const numMatch    = line.match(/^(\d+)[.)]\s+(.+)/);
    const bulletMatch = line.match(/^[•\-\*]\s+(.+)/);
    if (numMatch) {
      if (listType && listType !== 'ol') flushList();
      listType = 'ol'; listItems.push(numMatch[2]);
    } else if (bulletMatch) {
      if (listType && listType !== 'ul') flushList();
      listType = 'ul'; listItems.push(bulletMatch[1]);
    } else {
      flushList();
      out.push(React.createElement('p', {
        key: `p-${i}`,
        style: { color: 'rgba(255,255,255,0.65)', fontSize: 14, lineHeight: 1.75, margin: '0 0 10px', fontStyle: 'normal' },
        dangerouslySetInnerHTML: { __html: toBold(line) }
      }));
    }
  });
  flushList();
  return out;
};

  if (nav.view === 'home')       return '#home';
  if (nav.view === 'getstarted') return '#getstarted';
  if (nav.view === 'videos')     return '#videos';
  if (nav.view === 'category')   return `#category/${nav.catId}`;
  if (nav.view === 'article')    return `#article/${nav.articleId}/${nav.catId}`;
  if (nav.view === 'search')     return `#search/${encodeURIComponent(nav.query || '')}`;
  if (nav.view === 'ai-answer') return `#ai/${encodeURIComponent(nav.query || '')}`;
  return '#home';
}
function hashToNav(hash) {
  const h = hash.replace(/^#/, '');
  if (!h || h === 'home')         return { view: 'home' };
  if (h === 'getstarted')         return { view: 'getstarted' };
  if (h === 'videos')             return { view: 'videos' };
  const parts = h.split('/');
  if (parts[0] === 'category')    return { view: 'category', catId: parts[1] };
  if (parts[0] === 'article')     return { view: 'article', articleId: parts[1], catId: parts[2] };
  if (parts[0] === 'search')      return { view: 'search', query: decodeURIComponent(parts[1] || '') };
  if (parts[0] === 'ai')          return { view: 'ai-answer', query: decodeURIComponent(parts[1] || '') };
  return { view: 'home' };
}

function App() {
  const [theme, setTheme] = useState('dark');
  const [lang, setLang] = useState('en');
  const [nav, setNav] = useState(() => hashToNav(window.location.hash));
  const [showTicket, setShowTicket] = useState(false);
  const [allArticles, setAllArticles] = useState([]);
  const [popularArticles, setPopularArticles] = useState(POPULAR_ARTICLES);
  const [categories, setCategories] = useState(CATEGORIES);
  const [siteQuickSearches, setSiteQuickSearches] = useState(null);
  const [siteVideos, setSiteVideos] = useState(null);
  const [getStartedSteps, setGetStartedSteps] = useState(null);
  const [noticeBanner, setNoticeBanner] = useState(null);
  const [chatEnabled, setChatEnabled] = useState(true);
  const [ticketEnabled, setTicketEnabled] = useState(true);

  useEffect(() => {
    db.collection('articles').where('published', '==', true).get()
      .then(snap => setAllArticles(snap.docs.map(d => ({ id: d.id, ...d.data() }))))
      .catch(() => {});
  }, []);

  useEffect(() => {
    db.collection('siteConfig').doc('main').get()
      .then(doc => {
        if (!doc.exists) return;
        const data = doc.data();
        if (data.popularArticles) setPopularArticles(data.popularArticles);
        if (data.categories && data.categories.length > 0) setCategories(data.categories.filter(c => c.visible !== false));
        if (data.quickSearches && data.quickSearches.length > 0) setSiteQuickSearches(data.quickSearches);
        if (data.videos && data.videos.length > 0) setSiteVideos(data.videos);
        if (data.getStartedSteps && data.getStartedSteps.length === 5) setGetStartedSteps(data.getStartedSteps);
        if (data.noticeBanner && data.noticeBanner.active && data.noticeBanner.message) setNoticeBanner(data.noticeBanner);
        if (data.supportOptions) { if (data.supportOptions.chatEnabled === false) setChatEnabled(false); if (data.supportOptions.ticketEnabled === false) setTicketEnabled(false); }
      })
      .catch(() => {});
  }, []);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => {
    if (nav.view === 'ai-answer') {
      document.documentElement.setAttribute('data-view', 'ai');
    } else {
      document.documentElement.removeAttribute('data-view');
    }
  }, [nav.view]);

  // Sync hash → nav on browser back/forward
  useEffect(() => {
    const onHashChange = () => setNav(hashToNav(window.location.hash));
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const [transitionKey,  setTransitionKey]  = React.useState(0);
  const [overlayVisible, setOverlayVisible] = React.useState(false);
  const [overlayToAI,    setOverlayToAI]    = React.useState(false);

  const navigate = useCallback((newNav) => {
    const isToAI = newNav.view === 'ai-answer';
    setOverlayToAI(isToAI);
    setOverlayVisible(true);
    setTimeout(() => {
      const hash = navToHash(newNav);
      window.history.pushState(null, '', hash);
      setNav(newNav);
      setTransitionKey(k => k + 1);
      window.scrollTo({ top: 0 });
      setTimeout(() => setOverlayVisible(false), 40);
    }, 200);
  }, []);

  const onOpenTicket = useCallback(() => setShowTicket(true), []);
  const viewProps = { navigate, lang, onOpenTicket, allArticles, popularArticles, categories, siteQuickSearches, siteVideos, getStartedSteps, chatEnabled, ticketEnabled };

  const renderView = () => {
    switch (nav.view) {
      case 'home':       return <HomeView {...viewProps} />;
      case 'getstarted': return <GetStartedView {...viewProps} />;
      case 'category':   return <CategoryView catId={nav.catId} {...viewProps} />;
      case 'article':    return <ArticleView key={nav.articleId} articleId={nav.articleId} catId={nav.catId} {...viewProps} />;
      case 'videos':     return <VideoLibraryView {...viewProps} />;
      case 'search':     return <SearchView query={nav.query || ''} {...viewProps} />;
      case 'ai-answer':  return <AiAnswerView query={nav.query || ''} {...viewProps} />;
      default:           return <HomeView {...viewProps} />;
    }
  };

  const bannerBg = noticeBanner ? (noticeBanner.severity === 'critical' ? '#E8173A' : noticeBanner.severity === 'info' ? '#475569' : '#D97706') : null;
  const bannerIconName = noticeBanner ? (noticeBanner.severity === 'warning' ? 'alertTriangle' : 'alertCircle') : null;

  return (
    <>
      {noticeBanner && (
        <div style={{ background: bannerBg, padding: '13px 20px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, position: 'sticky', top: 0, zIndex: 1000 }}>
          <Icon name={bannerIconName} size={18} style={{ color: '#fff', flexShrink: 0 }} />
          <span style={{ width: 8, height: 8, borderRadius: '50%', flexShrink: 0, background: 'rgba(255,255,255,0.7)', animation: 'blink-dot 1.4s ease-in-out infinite', display: 'inline-block' }} />
          <span style={{ fontSize: 14, fontWeight: 600, color: '#fff', textAlign: 'center' }}>{noticeBanner.message}</span>
        </div>
      )}
      <Topbar theme={theme} setTheme={setTheme} lang={lang} setLang={setLang}
        navigate={navigate} onOpenTicket={onOpenTicket} currentView={nav.view} ticketEnabled={ticketEnabled} />
      <div key={transitionKey} className={nav.view !== 'ai-answer' ? 'view-enter' : ''}>
        {renderView()}
      </div>
      <footer style={{ textAlign: 'center', padding: '24px 16px', borderTop: '1px solid var(--border)', color: 'var(--text-3)', fontSize: 12 }}>
        © 2026 hoichoi. All Rights Reserved.
      </footer>
      {showTicket && <TicketModal onClose={() => setShowTicket(false)} lang={lang} />}
      {/* Page transition overlay */}
      <div style={{
        position: 'fixed', inset: 0, zIndex: 9998, pointerEvents: 'none',
        background: overlayToAI ? '#060202' : 'rgba(5,5,6,0.88)',
        opacity: overlayVisible ? 1 : 0,
        transition: overlayVisible ? 'opacity 190ms ease-in' : 'opacity 380ms ease-out',
      }} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
